  #   - dockerfile Dockerfile (cel scris de tine in sectiunea 01)
  #   - depends_on db cu condition: service_healthy
  #   - environment: ConnectionStrings__DefaultConnection (vezi .env.example)
  #   - environment: Jwt__Key (din .env)
  #   - expose: 8080
  #   - networks: [newsportal_net]
  # api:
  #   build: ...

  # TODO: adauga serviciul `frontend` care:
  #   - build context ./news-portal-app
  #   - depends_on api
  #   - expose 80
  # frontend:
  #   build: ...

  # TODO: adauga serviciul `proxy` care:
  #   - image nginx:1.27-alpine
  #   - depends_on api, frontend
  #   - ports 80:80 si 443:443
  #   - volume ./nginx/nginx.conf -> /etc/nginx/nginx.conf
  #   - volume ./nginx/conf.d -> /etc/nginx/conf.d
  #   - volume ./certs -> /etc/nginx/certs
  # proxy:
  #   image: nginx:1.27-alpine
  #   ...

volumes:
  db_data:

networks:
  newsportal_net:
    driver: bridge
