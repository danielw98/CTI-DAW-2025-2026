# TODO Lab 13 (Sectiunea 02 - docker-compose stack complet)
#
# Defineste 4 servicii orchestrate:
#  - db        Postgres 16-alpine cu volume persistent + healthcheck
#  - api       build din Dockerfile-ul tau, depends_on db (healthy)
#  - frontend  build din ./news-portal-app/Dockerfile
#  - proxy     nginx 1.27-alpine cu ports 80/443, monteaza ./nginx + ./certs
#
# Ruleaza: docker compose up -d --build
# Verifica: https://localhost (warn cert self-signed)

services:
  db:
    image: postgres:16-alpine
    container_name: newsportal-db
    environment:
      POSTGRES_USER: ${DB_USER:-newsportal}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-newsportal_dev}
      POSTGRES_DB: ${DB_NAME:-newsportal}
    volumes:
      - db_data:/var/lib/postgresql/data
    # TODO: adauga healthcheck cu pg_isready
    networks: [newsportal_net]
    restart: unless-stopped

  # TODO: adauga serviciul `api` care:
