<div class="container mt-5" style="max-width: 800px;">
  <div *ngIf="loading" class="alert alert-info">Se incarca...</div>

  <div *ngIf="notFound" class="alert alert-danger">
    <p class="mb-2">Articolul nu a fost gasit.</p>
    <button class="btn btn-sm btn-secondary" (click)="goBack()">Inapoi la lista</button>
  </div>

  <article *ngIf="article">
    <h1 class="mb-2">{{ article.title }}</h1>
    <p class="text-muted mb-3">
      <span class="badge bg-info">{{ article.categoryName }}</span>
      &middot; Autor: {{ article.authorName }}
      &middot; {{ article.publishedAt | date:'dd MMM yyyy, HH:mm' }}
    </p>

    <div *ngIf="article.tags && article.tags.length > 0" class="mb-3">
      <span *ngFor="let tag of article.tags" class="badge bg-secondary me-1">{{ tag }}</span>
    </div>

    <p class="lead">{{ article.content }}</p>

    <button class="btn btn-secondary mt-3" (click)="goBack()">
      ← Inapoi la lista
    </button>
  </article>
</div>
